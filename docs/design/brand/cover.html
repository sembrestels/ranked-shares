<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kulim+Park:wght@700&family=Lexend+Deca:wght@300&display=swap">
<style>
html,body{margin:0;width:640px;height:360px;overflow:hidden;background:#16261B;font-family:"Lexend Deca","Trebuchet MS",sans-serif}
.wrap{position:absolute;inset:0;padding:44px 48px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between}
.mark{width:110px;height:92px;display:flex;flex-direction:column;justify-content:space-between}
.bar{height:24px;border-radius:2px}
h1{margin:0;font-family:"Kulim Park","Trebuchet MS",sans-serif;font-weight:700;font-size:72px;line-height:1;letter-spacing:-0.02em;color:#FAFAF9}
p{margin:0;font-weight:300;font-size:21px;line-height:1.3;color:#AFC7B9;max-width:520px}
</style></head><body>
<div class="wrap">
  <div class="mark">
    <div class="bar" style="width:110px;background:#FF6A6A"></div>
    <div class="bar" style="width:72px;background:#AFC7B9"></div>
    <div class="bar" style="width:44px;background:#678A74"></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:16px">
    <h1>RankedShares</h1>
    <p>Proportional participatory budgeting in stablecoins. Every group of voters funds its share.</p>
  </div>
</div>
</body></html>
