[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
ffi = true
fs_permissions = [
    { access = "read", path = "./reference" },
    { access = "read", path = "./noir/proofs" },
]
gas_reports = ["PBEAR", "RankedShares", "SealedRankedShares", "Poseidon2"]
gas_limit = "18446744073709551615"
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fmt]
# The Honk verifiers are generated by noir/scripts/build.sh; formatting them would make
# every rebuild show up as a diff.
ignore = ["src/verifiers/*.sol", "test/verifiers/*VerifierTest.sol"]

[fuzz]
runs = 256
