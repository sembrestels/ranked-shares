[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
ffi = true
fs_permissions = [
    { access = "read", path = "./reference" },
    { access = "read", path = "./noir/proofs" },
    { access = "read", path = "./zisk/fixtures" },
    { access = "read-write", path = "./zisk/proofs" },
]
gas_reports = ["PBEAR", "RankedShares", "NoirRankedShares", "Poseidon2"]
gas_limit = "18446744073709551615"
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fmt]
# The Honk verifiers are generated by noir/scripts/build.sh and the ZisK verifier is
# vendored from the PLONK key; formatting them would make every rebuild show up as a diff.
ignore = [
    "src/noir/verifiers/*.sol",
    "test/noir/verifiers/*VerifierTest.sol",
    "src/zisk/IZiskVerifier.sol",
    "src/zisk/PlonkVerifier.sol",
    "src/zisk/ZiskVerifier.sol",
]

[fuzz]
runs = 256
